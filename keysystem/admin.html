<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lizard - Gestion des licences</title>
<style>
  :root {
    --bg: #0f0f13; --card: #1a1a22; --line: #2a2a36; --text: #e8e8f0;
    --muted: #9a9ab0; --accent: #00aaff; --green: #5ed17b; --red: #ff5a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  input, textarea, select {
    background: #101018; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; outline: none; font-family: inherit;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  button.red { background: var(--red); }
  button.green { background: var(--green); color: #0a2a12; }
  textarea { width: 100%; min-height: 120px; font-family: Consolas, monospace; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .status { font-size: 13px; margin-top: 10px; }
  .status.ok { color: var(--green); } .status.err { color: var(--red); }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.valid { background: rgba(94,209,123,.15); color: var(--green); }
  .badge.exp { background: rgba(255,90,90,.15); color: var(--red); }
  .gen { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
  <h1>lizard <span>· gestion des licences</span></h1>
  <div class="sub">Les clés sont liées à un UserId Roblox. Garde ce panneau privé (contient la clé de service).</div>

  <div class="card">
    <div class="row">
      <div class="field" style="flex:2">
        <label>URL du projet Supabase</label>
        <input id="supUrl" placeholder="https://xxxx.supabase.co">
      </div>
      <div class="field" style="flex:3">
        <label>Clé de service (service_role) — jamais à mettre dans le script</label>
        <input id="serviceKey" type="password" placeholder="eyJhbGciOi...">
      </div>
      <button class="green" onclick="listLicenses()">Charger</button>
    </div>
  </div>
  <div class="card">
    <h1 style="font-size:16px">Créer une licence</h1>
    <div class="row" style="margin-top:10px">
      <div class="field">
        <label>UserId Roblox</label>
        <input id="newUserId" type="number" placeholder="123456789">
      </div>
      <div class="field">
        <label>Durée (jours, 0 = illimitée)</label>
        <input id="newDays" type="number" value="0" min="0">
      </div>
      <div class="field" style="flex:1">
        <label>Note (pseudo, discord…)</label>
        <input id="newNote" placeholder="Discord du client">
      </div>
      <button onclick="createLicense()">Générer la clé</button>
    </div>
    <div class="status" id="createStatus"></div>
  </div>

  <div class="card">
    <h1 style="font-size:16px">Licences existantes</h1>
    <div style="overflow-x:auto; margin-top:10px">
      <table>
        <thead>
          <tr><th>Clé</th><th>UserId</th><th>Expire</th><th>Note</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="status" id="listStatus"></div>
  </div>

  <div class="card">
    <h1 style="font-size:16px">Code source du script (obfusqué) — stocké côté serveur</h1>
    <div class="row" style="margin-top:10px">
      <div class="field" style="flex:1">
        <label>Réglage par défaut du shell</label>
        <select id="scriptTarget" style="flex:1">
          <option value="main">main</option>
        </select>
      </div>
      <button class="ghost" onclick="loadScript()">Charger</button>
      <button class="green" onclick="saveScript()">Enregistrer</button>
    </div>
    <textarea id="scriptBody" placeholder="Colle ici le code obfusqué (ou brut en attendant)."></textarea>
    <div class="status" id="scriptStatus"></div>
  </div>

<script>
const state = { url: '', key: '' };

function applyConfig() {
  if (window.LIZARD_CONFIG) {
    const c = window.LIZARD_CONFIG;
    if (c.url) document.getElementById('supUrl').value = c.url;
    if (c.serviceKey) document.getElementById('serviceKey').value = c.serviceKey;
  }
}

function setup() {
  state.url = document.getElementById('supUrl').value.trim();
  state.key = document.getElementById('serviceKey').value.trim();
  if (!state.url || !state.key) throw new Error('URL et clé de service requises');
}

async function sup(path, opts = {}) {
  const res = await fetch(state.url + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'apikey': state.key,
      'Authorization': 'Bearer ' + state.key,
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    throw new Error('HTTP ' + res.status + (t ? ': ' + t.slice(0, 200) : ''));
  }
  return res.json().catch(() => null);
}

function fmt(ts) {
  if (!ts) return '<span class="badge valid">illimitée</span>';
  const exp = new Date(ts);
  const now = Date.now();
  if (exp.getTime() < now) return '<span class="badge exp">expirée</span>';
  return '<span class="badge valid">' + exp.toLocaleDateString('fr-FR') + '</span>';
}

function genKey() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let k = [];
  for (let i = 0; i < 4; i++) {
    let seg = '';
    for (let j = 0; j < 4; j++) seg += chars[Math.floor(Math.random() * chars.length)];
    k.push(seg);
  }
  return k.join('-');
}

async function listLicenses() {
  try {
    setup();
    const rows = await sup('/rest/v1/licenses?select=*&order=created_at.desc');
    const tb = document.getElementById('rows');
    tb.innerHTML = '';
    for (const r of rows) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td style="font-family:monospace">' + r.key + '</td>' +
        '<td>' + r.userid + '</td>' +
        '<td>' + fmt(r.expires_at) + '</td>' +
        '<td>' + (r.note || '') + '</td>' +
        '<td><button class="red" onclick="revokeKey(\'' + r.key + '\')">Révoquer</button></td>';
      tb.appendChild(tr);
    }
    setStatus('listStatus', rows.length + ' licence(s)', true);
  } catch (e) { setStatus('listStatus', e.message, false); }
}

async function createLicense() {
  try {
    setup();
    const userid = parseInt(document.getElementById('newUserId').value);
    const days = parseInt(document.getElementById('newDays').value);
    if (!userid || isNaN(userid)) throw new Error('UserId invalide');
    const key = genKey();
    const expires_at = days > 0 ? new Date(Date.now() + days * 864e5).toISOString() : null;
    const row = { key, userid, expires_at, note: document.getElementById('newNote').value };
    await sup('/rest/v1/licenses', {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify(row),
    });
    setStatus('createStatus', 'Clé générée pour UserId ' + userid + ' : <b>' + key + '</b>', true);
    listLicenses();
  } catch (e) { setStatus('createStatus', e.message, false); }
}

async function revokeKey(key) {
  if (!confirm('Révoquer ' + key + ' ?')) return;
  try {
    setup();
    await sup('/rest/v1/licenses?key=eq.' + encodeURIComponent(key), { method: 'DELETE' });
    listLicenses();
  } catch (e) { setStatus('listStatus', e.message, false); }
}

async function loadScript() {
  try {
    setup();
    const rows = await sup('/rest/v1/scripts?select=id,body&id=eq.' + document.getElementById('scriptTarget').value);
    document.getElementById('scriptBody').value = (rows[0] && rows[0].body) || '';
    setStatus('scriptStatus', 'Chargé.', true);
  } catch (e) { setStatus('scriptStatus', e.message, false); }
}

async function saveScript() {
  try {
    setup();
    const body = document.getElementById('scriptBody').value;
    const id = document.getElementById('scriptTarget').value;
    await sup('/rest/v1/scripts', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ id, body }),
    });
    setStatus('scriptStatus', 'Enregistré (' + body.length + ' octets).', true);
  } catch (e) { setStatus('scriptStatus', e.message, false); }
}

function setStatus(id, msg, ok) {
  const el = document.getElementById(id);
  el.innerHTML = msg;
  el.className = 'status ' + (ok ? 'ok' : 'err');
}

applyConfig();
</script>
</body>
</html>
